# Check every cask the way a user meets it: style and audit first, then a
# real install on a macOS runner, a run of the installed binary, and an
# uninstall with --zap. Once on Apple Silicon and once on Intel, since each
# cask installs a different build on each.
#
# The app release workflows push version bumps here with a personal access
# token rather than GITHUB_TOKEN, so their pushes run this workflow too: every
# release that reaches the tap is installed once before anyone else installs
# it.
#
# Third-party actions are pinned to a full commit SHA, with the release that
# SHA belongs to in a trailing comment; bump both together.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # `audit --online` asks the GitHub API about each cask's repository.
  # Anonymous requests share a limit of 60 an hour with every other job on
  # the runner's IP, and one run had its audit fail on that limit; the job's
  # own token lifts it.
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  casks:
    name: casks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the last Intel image GitHub offers.
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Homebrew finds a tap by its directory under Library/Taps. Linking the
      # checkout there tests this commit, not whatever `main` holds on GitHub.
      - name: Tap the checkout as xcomart/tap
        run: |
          taps="$(brew --repository)/Library/Taps/xcomart"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew tap

      # Since Homebrew 6 a third-party tap is ignored until it is trusted.
      # `style` and `audit` load the whole tap, so they need tap-wide trust.
      - name: Trust the tap
        run: brew trust xcomart/tap

      - name: Style
        run: brew style xcomart/tap

      # On Intel, a cask from before the Intel build is skipped here as it is
      # below: auditing it would judge the Apple Silicon download against an
      # Intel Mac's oldest supported macOS.
      - name: Audit
        run: |
          set -euo pipefail
          for cask in Casks/*.rb; do
            name=$(basename "$cask" .rb)
            if [ "$(uname -m)" = x86_64 ] && grep -qx '  depends_on arch: :arm64' "$cask"; then
              echo "::notice title=$name::Apple Silicon only at this version; not audited on Intel"
              continue
            fi
            brew audit --cask --strict --online "xcomart/tap/$name"
          done

      # Installed the way a user installs them: tap-wide trust dropped again,
      # so each fully qualified install trusts its own cask and nothing else.
      # Then what matters for these bundles in particular: the executable is
      # where the `app` stanza says, the bundle's own ad-hoc signature still
      # holds, and the postflight really took the quarantine flag off, which
      # is the difference between an app that opens and one Gatekeeper
      # refuses.
      - name: Install, check and uninstall
        run: |
          set -euo pipefail
          brew untrust xcomart/tap
          for cask in Casks/*.rb; do
            name=$(basename "$cask" .rb)
            app="/Applications/$name.app"
            # A cask from before the Intel build still declares Apple Silicon
            # alone, until the next release of its application rewrites it.
            if [ "$(uname -m)" = x86_64 ] && grep -qx '  depends_on arch: :arm64' "$cask"; then
              echo "::notice title=$name::Apple Silicon only at this version; not installed on Intel"
              continue
            fi
            brew install --cask "xcomart/tap/$name"
            test -x "$app/Contents/MacOS/$name"
            codesign --verify --strict "$app"
            # `--version` prints "<name> <version>" and exits before any
            # window opens, so it proves the bundle runs and is the release
            # the cask names.
            version=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$cask")
            reported=$("$app/Contents/MacOS/$name" --version)
            if [ "$reported" != "$name $version" ]; then
              echo "::error title=$name::--version printed '$reported', expected '$name $version'"
              exit 1
            fi
            # The quarantine check below only means something if Homebrew
            # quarantined the download in the first place; say which it was.
            download=$(brew --cache --cask "xcomart/tap/$name")
            if xattr -p com.apple.quarantine "$download" > /dev/null 2>&1; then
              echo "$name: the download was quarantined"
            else
              echo "::notice title=$name::the download carried no quarantine flag, so the check below proves nothing"
            fi
            if xattr -r "$app" | grep -q com.apple.quarantine; then
              echo "::error title=$name::$app still carries com.apple.quarantine"
              exit 1
            fi
            brew uninstall --cask --zap "xcomart/tap/$name"
            test ! -e "$app"
          done
